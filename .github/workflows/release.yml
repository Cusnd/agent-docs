name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG!=='v'+p.version) throw new Error('tag/version mismatch')"
      - run: npm run check
      - run: npm run test:performance

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - "22"
          - "24"
          - "26"
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run release:verify
      - name: Install the verified Codex CLI only in the runner
        run: npm install --global @openai/codex@0.147.0 --no-audit --no-fund
      - run: npm run release:smoke
      - name: Upload deterministic package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: |
            dist/agent-docs-marketplace-v0.2.0.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish attested release
    runs-on: ubuntu-latest
    needs:
      - quality
      - test
      - package
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require an annotated tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
      - name: Download all operating-system packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
      - run: node scripts/compare-release-artifacts.mjs artifacts
      - name: Select the verified Linux copy
        run: mkdir -p release && cp artifacts/release-Linux/agent-docs-marketplace-v0.2.0.zip artifacts/release-Linux/SHA256SUMS release/
      - name: Verify selected checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG"
      - name: Attest Marketplace ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/agent-docs-marketplace-v0.2.0.zip
      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/agent-docs-marketplace-v0.2.0.zip release/SHA256SUMS --verify-tag --title "Agent Docs $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
