name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Enforce append-only Requirement archives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run archive:check
      - run: npm run test:coverage

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - "22"
          - "24"
          - "26"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run release:verify
      - name: Install the verified Codex CLI only in the runner
        run: npm install --global @openai/codex@0.147.0 --no-audit --no-fund
      - run: npm run release:smoke
      - name: Upload deterministic package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-${{ runner.os }}
          path: |
            dist/agent-docs-marketplace-v0.2.0.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  archive-digests:
    name: cross-os archive digest
    runs-on: ubuntu-latest
    needs:
      - package
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: marketplace-*
          path: artifacts
      - run: node scripts/compare-release-artifacts.mjs artifacts

  gate:
    name: CI / gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - quality
      - test
      - package
      - archive-digests
    steps:
      - name: Require every CI component
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DIGEST_RESULT: ${{ needs.archive-digests.result }}
        run: node -e "const r=process.env; const values=[r.QUALITY_RESULT,r.TEST_RESULT,r.PACKAGE_RESULT,r.DIGEST_RESULT]; console.log(values.join(',')); if(values.some((value)=>value!=='success')) process.exit(1)"
