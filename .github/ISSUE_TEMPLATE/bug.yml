name: Bug report / 缺陷报告
description: Report a reproducible Agent Docs defect. / 报告可复现缺陷。
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Remove credentials, private paths, repository content, and full terminal captures.
        请勿在这里报告安全漏洞；请移除凭据、私有路径、仓库内容和完整终端输出。
  - type: input
    id: version
    attributes:
      label: Agent Docs version / 版本
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Codex CLI, Node.js, OS, and clone/linked-worktree shape. / 请提供 Codex、Node、系统和仓库形态。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现
      description: Use repository-relative paths and compact sanitized output. / 只使用仓库相对路径和脱敏摘要。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks / 确认
      options:
        - label: I searched existing Issues and Discussions. / 我已搜索现有 Issue 与 Discussion。
          required: true
        - label: This is not a vulnerability and contains no private or secret data. / 这不是漏洞，且不含私密或秘密数据。
          required: true
